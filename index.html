<body>
<header>
 <button id="toggle" class="icon-btn" aria-label="收起或展开部署面板" data-icon="panel"></button>
 <div class="brand-emblem" data-icon="crest"></div><div class="brand"><h1>铁血沙盘</h1><small>IRON SANDBOX</small></div>
 <span class="brand-sub">全面战争模拟器</span>
 <div class="actions"><span class="phase" id="phase">布阵阶段</span><button id="sound" class="icon-btn" title="切换音效" aria-label="切换音效" data-icon="sound"></button><button id="reset"><i data-icon="reset"></i>还原</button><button id="speed">1.0×</button><button id="fight" class="primary"><i data-icon="swords"></i><span>开战</span></button></div>
</header>
<main>
 <aside id="sidebar">
  <div class="side-head"><div class="kicker">DEPLOYMENT</div><h2>军团部署</h2><i class="section-mark" data-icon="flag"></i></div>
  <div class="team-tabs" aria-label="部署阵营"><button data-team="blue" class="on"><i data-icon="flag"></i>蓝方阵营</button><button data-team="red"><i data-icon="flag"></i>红方阵营</button></div>
  <div class="side-caption"><b>部署阵型</b><button id="erase" title="切换擦除工具"><i data-icon="eraser"></i>擦除</button></div>
  <div class="forms"><button data-form="single" class="on"><i data-icon="single"></i>单兵</button><button data-form="line"><i data-icon="line"></i>横列</button><button data-form="square"><i data-icon="square"></i>方阵</button><button data-form="wedge"><i data-icon="wedge"></i>楔阵</button></div>
  <div class="roster-title"><h3>兵种名册</h3><span id="roster-count"></span></div>
  <nav id="categories" aria-label="兵种分类"></nav>
  <div id="cards" aria-label="兵种名册"></div>
  <section id="inspect" aria-label="兵种详情"></section>
 </aside>
 <section class="workspace">
  <div class="map-title"><div><div class="kicker"><span class="gold-rule"></span> TACTICAL MAP</div><h2>战术沙盘</h2></div>
   <div class="selects"><label><i data-icon="map"></i><select id="maps" aria-label="选择战场"></select></label><label><i data-icon="scroll"></i><select id="preset" aria-label="选择战役"></select></label></div>
  </div>
  <div class="map-frame"><div class="map-viewport" id="view"><canvas id="canvas" aria-label="互动战场"></canvas>
   <div class="map-plaque"><span class="plaque-icon" data-icon="terrain"></span><div><span id="mapName"></span><small id="mapEnglish"></small></div></div>
   <div id="zoomTools"><button id="plus" aria-label="放大">+</button><output id="zoomVal">100%</output><button id="minus" aria-label="缩小">−</button><button id="fit" aria-label="重置镜头" data-icon="fit"></button><button id="hp" aria-label="切换生命条" data-icon="heart"></button></div>
   <div id="dock" hidden><label><input id="auto" type="checkbox" checked> 自动绝技</label><div id="skills"></div></div>
   <div id="toast" role="status"></div>
  </div></div>
  <div class="map-foot"><span id="tip" title="空格键加拖动可平移镜头"><i data-icon="mouse"></i><span>点击部署 · 右键擦除 · 滚轮缩放</span></span><div><button id="mirror"><i data-icon="mirror"></i>镜像</button><button id="random"><i data-icon="dice"></i>随机混战</button><details id="more"><summary title="清除单位" aria-label="清除单位">···</summary><div><button id="clearSide">清空本方</button><button id="clearAll">清空全场</button></div></details></div></div>

 </section>
</main>

/* Original canvas cartography for the 2000 × 1200 battlefield. All detail is

  "use strict";

  const W = 2000;
  const H = 1200;
  const TAU = Math.PI * 2;
  // Light, local tint, shadow, engraving ink, woodland wash.
  const inks = {
    plains: ["#e9dfbe", "#c8c9a6", "#acaa87", "#625e46", "#87936b"],
    river: ["#e6dbb9", "#bdc8a7", "#a8ac8c", "#62604a", "#82916b"],
    volcano: ["#d5b599", "#c09677", "#9f7865", "#604637", "#8a8064"],
    snow: ["#e5e4d7", "#c9d2cd", "#acb9ba", "#52615e", "#81918a"],
    citadel: ["#e9debf", "#c7c5a4", "#a8a789", "#605c48", "#87946f"],
    desert: ["#f0dfb6", "#d9c392", "#c7a674", "#7c6040", "#9a986e"],
    woods: ["#d9d8ae", "#b4bf98", "#939f7d", "#555e45", "#788963"],
    colosseum: ["#e2d9c2", "#c9bfa9", "#b5ab94", "#625950", "#8e9473"]
  };

  function dice(s) {
    return () => {
      s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  function path(c, points, fill, close = false) {
    c.beginPath();
    c.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) c.lineTo(points[i][0], points[i][1]);

  }

  function wash(c, x, y, w, h, color, alpha) {
    c.save();
    c.translate(x, y);
    c.scale(w, h);
    c.globalAlpha = alpha;
    const grad = c.createRadialGradient(0, 0, 0, 0, 0, 1);
    grad.addColorStop(0, color);
    grad.addColorStop(0.42, color + "a8");
    grad.addColorStop(1, color + "00");

  }

  function contours(c, ink, seed) {
    // March through a continuous height field, interpolating crossings to keep
    // the contour strokes smooth across cell boundaries.
    const step = 12, nx = Math.ceil(W / step) + 1, ny = Math.ceil(H / step) + 1;
    const z = new Float32Array(nx * ny);
    for (let y = 0; y < ny; y++) {
      for (let x = 0; x < nx; x++) {
        const px = x * step, py = y * step;
        const a = px * 0.005 + 1.1 * Math.sin(py * 0.0053 + seed);
        const b = py * 0.0044 + 0.78 * Math.sin(px * 0.0051 - seed);
        z[y * nx + x] = 0.84 * Math.sin(a) + 0.72 * Math.cos(b)
          + 0.32 * Math.sin(1.8 * a + b) + 0.19 * Math.sin(2.3 * b - 0.45 * a)

    c.save();
    c.strokeStyle = ink;
    for (let n = 0; n < 28; n++) {
      const level = -1.98 + n * 0.151;
      c.globalAlpha = n % 4 === 0 ? 0.29 : 0.17;
      c.lineWidth = n % 4 === 0 ? 1.45 : 0.9;
      c.beginPath();
      for (let y = 0; y < ny - 1; y++) {
        for (let x = 0; x < nx - 1; x++) {

  // Sparse engraved hill chains use a lit face, a shaded face, and broken

  function peak(c, x, y, w, h, p, rand) {
    c.save();
    c.translate(x, y);
    c.scale(w, h);

    const right = [[0, -1], [0.16, -0.80], [0.27, -0.70], [0.48, -0.48], [0.64, -0.39], [0.78, -0.17], [1, 0.02]];

    c.globalAlpha = 0.38;
    c.fillStyle = p[3];
    path(c, [...right, ...seam.slice(1).reverse()], true, true);
    c.strokeStyle = p[3];
    c.globalAlpha = 0.88;
    c.lineWidth = 1.9 / w;
    path(c, left); path(c, right); path(c, seam);
    c.globalAlpha = 0.63;
    c.lineWidth = 1.05 / w;
    for (let i = 0; i < 18; i++) {
      const dy = 0.08 + i * 0.046, dx = Math.max(0, dy * 0.19 + rand() * 0.04);

    }

      const dy = 0.2 + i * 0.1;

  }

  function ridge(c, x, y, length, angle, scale, p, rand) {
    const peaks = [];
    const count = Math.round(length / (36 * scale));
    for (let i = 0; i < count; i++) {
      const t = i / Math.max(1, count - 1);
      const taper = 0.40 + Math.sin(Math.PI * t) * 0.6;
      const w = (39 + rand() * 32) * scale * taper;
      peaks.push([x + Math.cos(angle) * i * 35 * scale + (rand() - 0.5) * 17,

  function tree(c, t, p) {

      [3.2, 0.3], [7.6, 1.0], [3.8, -4.5], [6, -3.8], [2.1, -10.5], [4, -9.6], [0, -20]];

    c.globalAlpha = 0.86;

    c.globalAlpha = 0.67;

    c.restore();

      path(c, [[0, 0], [-width, -7], [0, -r], [0, 0]]);

    c.textAlign = 'center';

    c.restore();
  }

  function label(c, name, x, y, p, angle = 0) {
    c.save(); c.translate(x, y); c.rotate(angle);

    c.font = '500 16px "Songti SC","Noto Serif CJK SC",serif';
    c.fillStyle = p[3];

      } else if (o.type === "pillar") {
        c.save(); c.translate(x, y);
        c.fillStyle = "#8c816e"; c.fillRect(-r * 0.63, -r * 0.65, r * 1.45, r * 1.6);

        c.strokeStyle = p[3]; c.lineWidth = 2;

        }

        const rx = lake ? o.rx : r, ry = lake ? o.ry : r;
        c.save();
        const pts = [];
        for (let i = 0; i <= 90; i++) {
          const a = i * TAU / 90, shape = 1 + 0.035 * Math.cos(a * 6) + 0.025 * Math.sin(a * 9);
          pts.push([x + rx * shape * Math.cos(a), y + ry * shape * Math.sin(a)]);
        }

        path(c, pts, true, true);
        c.strokeStyle = p[3]; c.lineWidth = 2; path(c, pts, false, true);
        c.clip();
        c.strokeStyle = lava ? "#edbc72" : lake ? "#ebede1" : "#95774e";
        for (let i = 0; i < 54; i++) {
          const sx = x + (rand() * 2 - 1) * rx, sy = y + (rand() * 2 - 1) * ry;
          const l = (rand() * 0.45 + 0.08) * rx;
          c.lineWidth = 0.95 + rand();
          path(c, [[sx, sy], [sx + l * 0.35, sy + rand() * 10], [sx + l, sy - rand() * 12]]);
        }
        c.restore();
      }
    }
    for (const w of map.walls || []) {
      c.save(); c.fillStyle = "#8b8974";
      c.fillRect(w.x + 6, w.y + 7, w.w, w.h);
      c.fillStyle = "#c7bca0"; c.fillRect(w.x, w.y, w.w, w.h);
      c.strokeStyle = p[3]; c.lineWidth = 2; c.strokeRect(w.x, w.y, w.w, w.h);

        path(c, [[w.x, y], [w.x + w.w, y]]);
        const xx = w.x + (Math.round((y - w.y) / 14) % 2 ? 10 : 29);
        path(c, [[xx, y], [xx, y + 13]]);

    c.fillStyle = p[0]; c.fillRect(0, 0, W, H);

    wash(c, 1630, 730, 940, 780, p[1], 0.94);
    wash(c, 410, 1200, 480, 640, p[2], 0.58);
    for (let i = 0; i < 34; i++) {
      wash(c, rand() * W, rand() * H, 90 + rand() * 240, 56 + rand() * 210,
        rand() > 0.42 ? p[1] : "#fff0ce", 0.18 + rand() * 0.19);
    }

    c.fillStyle = p[3]; c.globalAlpha = 0.15;
    for (let i = 0; i < 24500; i++) {
      c.fillRect(rand() * W, rand() * H, 0.65 + rand() * 1.4, 0.6 + rand() * 0.94);
    }
    c.globalAlpha = 0.18;
    c.strokeStyle = p[3]; c.lineWidth = 1.35; c.beginPath();
    for (let x = 0; x <= W; x += 125) { c.moveTo(x, 0); c.lineTo(x, H); }
    for (let y = 0; y <= H; y += 125) { c.moveTo(0, y); c.lineTo(W, y); }
    c.stroke(); c.globalAlpha = 1;
    contours(c, p[3], (seed % 379) / 73);
    c.strokeStyle = p[3]; c.globalAlpha = 0.39; c.lineWidth = 1.2;
    for (let i = 0; i < 1050; i++) {
      const x = rand() * W, y = rand() * H;
      c.beginPath(); c.moveTo(x - 3, y - 1);
      c.lineTo(x, y); c.lineTo(x - 1, y - 4 - rand() * 2);
      c.moveTo(x + 2, y); c.lineTo(x + 5, y - 2);
      c.stroke();
    }
    c.globalAlpha = 1;
    if (map.id !== "colosseum") {
      road(c, [[-20, 870], [180, 830, 220, 680, 445, 701], [710, 742, 764, 512, 970, 513],
        [1189, 513, 1342, 318, 1525, 369], [1710, 420, 1805, 240, 2030, 278]], p[3]);
      road(c, [[277, -15], [310, 176, 468, 284, 439, 446], [423, 558, 342, 630, 366, 703]], p[3]);
      road(c, [[1440, 364], [1482, 583, 1659, 562, 1625, 772], [1580, 955, 1717, 1054, 1822, 1214]], p[3]);
      const sand = map.id === "desert" ? 0.72 : 1;
      ridge(c, 2, 250, 400, -0.58, 1.23 * sand, p, rand);
      ridge(c, 62, 287, 245, -0.61, 0.85 * sand, p, rand);
      ridge(c, 1435, 65, 470, 0.24, 1.16 * sand, p, rand);
      ridge(c, 1730, 115, 210, 0.65, 0.82 * sand, p, rand);
      ridge(c, 2, 1065, 460, 0.24, 1.19 * sand, p, rand);
      ridge(c, 1680, 932, 345, -0.64, sand, p, rand);
    }
    terrain(c, map, p, rand);
    if (map.id === "plains") {
      label(c, "西 岭", 178, 183, p, -0.22);
      label(c, "青 石 岭", 1640, 154, p, 0.13);
      label(c, "北 林", 1002, 282, p);
      label(c, "南 林", 1005, 1128, p);
    }
    compass(c, 1867, 1052, p[3]);
    c.restore();
  }
  window.paintMap = paintMap;
})();

function tone(type){

 try{
   const AC=window.AudioContext||window.webkitAudioContext;
   if(!AC)return;
   audio??=new AC(); if(audio.state==='suspended')audio.resume().catch(()=>{});

function spawn(id,team,x,y){

const terrainSolid=o=>['rock','pillar','lava'].includes(o.type);
function blocked(x,y,r){
 return game.map.obstacles.some(o=>terrainSolid(o)&&Math.hypot(x-o.x,y-o.y)<o.r+r)||
 (game.map.walls||[]).some(w=>x+r>w.x&&x-r<w.x+w.w&&y+r>w.y&&y-r<w.y+w.h);
}
function ground(u){
 let speed=1,hill=false;
 const m=game.map,r=u.d.radius;
 if(m.river&&u.x>m.river.x&&u.x<m.river.x+m.river.w&&!m.river.bridges.some(b=>u.y>b.y&&u.y<b.y+b.h))speed*=.5;

  const dx=u.x-o.x,dy=u.y-o.y,d=Math.hypot(dx,dy);
  if(terrainSolid(o)&&d<r+o.r){
   const a=Math.atan2(dy,dx);u.x=o.x+Math.cos(a)*(r+o.r);u.y=o.y+Math.sin(a)*(r+o.r);
   if(o.type==='lava'&&game.phase==='battle'){u.burn=2;u.burnDps=14;u.burnOwner=null}
  }else if(d<o.r&&(o.type==='forest'||o.type==='pine')&&u.d.cav)speed*=.78;
  else if(d<o.r&&o.type==='quicksand')speed*=.55;
  else if(o.ry&&(dx/o.rx)**2+(dy/o.ry)**2<=1){if(o.type==='ice')speed*=1.15;if(o.type==='hill')hill=true}
 }
 for(const w of m.walls||[]){
  const dx=u.x-clamp(u.x,w.x,w.x+w.w),dy=u.y-clamp(u.y,w.y,w.y+w.h),d=Math.hypot(dx,dy);
  if(!d&&u.x>=w.x&&u.x<=w.x+w.w&&u.y>=w.y&&u.y<=w.y+w.h)u.x=u.x<w.x+w.w/2?w.x-r:w.x+w.w+r;
  else if(d>0&&d<r){u.x+=dx/d*(r-d);u.y+=dy/d*(r-d)}
 }

}
function snapshot(){game.snapshot=game.units.filter(u=>u.d.id!=='skeleton').map(u=>[u.d.id,u.team,u.x,u.y])}

function ring(x,y,r,color,life=.45){game.effects.push({type:'ring',x,y,r,color,t:life,life})}
function hit(a,b,power,ap=0,kb=0,ranged=false,dot=false){

 if(a){a.damage+=dmg;if(a.d.steal&&a.alive)a.hp=Math.min(a.d.hp,a.hp+dmg*a.d.steal);
  const ang=Math.atan2(b.y-a.y,b.x-a.x);b.vx+=Math.cos(ang)*kb*4.5/b.d.mass;b.vy+=Math.sin(ang)*kb*4.5/b.d.mass}

}
function launch(u,tx,ty,extra){

}
function special(u){

 for(const e of enemies.slice(0,30)){const n=enemies.filter(v=>distance(e,v)<130).length;if(n>best){best=n;target=e}}

function shotHit(p,e){

function updateShots(dt){
 game.shots=game.shots.filter(p=>{
  const ox=p.x,oy=p.y;p.t+=dt;if(p.t<0)return true;
  const f=Math.min(1,p.t/p.dur);p.x=p.sx+(p.tx-p.sx)*f;p.y=p.sy+(p.ty-p.sy)*f;
  const enemies=game.units.filter(v=>v.alive&&v.team!==p.owner.team);
  if(p.pierce){
   const dx=p.x-ox,dy=p.y-oy,len=dx*dx+dy*dy||1;
   for(const e of enemies){if(p.hit.has(e.uid))continue;const k=clamp(((e.x-ox)*dx+(e.y-oy)*dy)/len,0,1);
    if(Math.hypot(e.x-ox-k*dx,e.y-oy-k*dy)<e.d.radius+8){shotHit(p,e);p.hit.add(e.uid);if(!--p.pierce){p.tx=p.x;p.ty=p.y;break}}}
   if(!p.pierce&&!p.aoe)return false;
  }
  if(f<1&&(p.pierce||!p.hit.size))return true;
  if(p.aoe){ring(p.tx,p.ty,p.aoe,p.slow?'#87b6c3':'#bf7641');
   for(const e of enemies)if(!p.hit.has(e.uid)&&Math.hypot(e.x-p.tx,e.y-p.ty)<p.aoe+e.d.radius)shotHit(p,e)

   if(victim){const wood=game.map.obstacles.some(o=>['forest','pine'].includes(o.type)&&distance(o,victim)<o.r);if(!wood||Math.random()>.15)shotHit(p,victim)}

function simulate(dt){

 if(!teams.red.length||!teams.blue.length){game.phase='ended';syncUI();reportResult(teams);return}
 const gens=alive.filter(u=>u.d.ult);
 for(const u of alive){
  if(!u.alive)continue;
  const d=u.d,allies=teams[u.team],enemies=teams[u.team==='blue'?'red':'blue'];
  for(const key of ['flash','slow','haste','shield'])u[key]=Math.max(0,u[key]-dt);

   switch(g.d.aura){case 'atk':power+=.2;break;case 'def':u.armorBuff=1.25;break;case 'haste':rate*=.8;break;
    case 'speed':speed+=.22;rate*=.9;break;case 'heal':u.hp=Math.min(d.hp,u.hp+dt*9);break;}
  }

  if(d.berserk&&u.hp<d.hp/2){power*=1.35;rate*=.65;speed*=1.2}
  if(d.ult){u.skill=Math.max(0,u.skill-dt);if(u.team==='red'||game.auto)special(u)}
  if(d.summon&&(u.summon-=dt)<=0){u.summon=d.summon;for(let k=0;k<2;k++)spawn('skeleton',u.team,u.x+Math.cos(u.face)*26,u.y+(k?16:-16))}
  u.x+=u.vx*dt;u.y+=u.vy*dt;u.vx*=.05**dt;u.vy*=.05**dt;u.cd-=dt;
  if(d.healer){let injured=null,low=.96;for(const v of allies){if(v.alive&&v!==u&&v.hp/v.d.hp<low&&distance(u,v)<460){injured=v;low=v.hp/v.d.hp}}
   if(injured){const a=Math.atan2(injured.y-u.y,injured.x-u.x);if(distance(injured,u)>d.range*.85){u.x+=Math.cos(a)*d.speed*speed*dt;u.y+=Math.sin(a)*d.speed*speed*dt}
    else if(u.cd<=0){u.cd=d.cd*rate;ring(injured.x,injured.y,125,'#719760');for(const v of allies)if(v.alive&&distance(v,injured)<=125){v.hp=Math.min(v.d.hp,v.hp+42);v.burn=0}}continue}
  }

  u.face=a;

   let dir=a,step=d.speed*speed*dt;if(dist<range)step*=-.85;
   if(step>0&&blocked(u.x+Math.cos(dir)*(d.radius+step),u.y+Math.sin(dir)*(d.radius+step),d.radius)){
    const sign=game.map.walls?(u.y<600?(u.y<445?1:-1):(u.y<755?1:-1)):(u.y<600?-1:1);

   }

  if(d.proj){const spread=d.proj==='boulder'?28:d.proj==='arrow'?14:6;launch(u,target.x+(Math.random()-.5)*spread,target.y+(Math.random()-.5)*spread,{dmg});tone(d.aoe?'cannon':'arrow')}
  else{tone('hit');if(d.cleave){for(const e of enemies)if(e.alive&&distance(u,e)<=d.cleave+e.d.radius)hit(u,e,dmg,d.ap,d.kb||12)}
   else hit(u,target,dmg,d.ap,d.kb||8)}
 }
 for(let i=0;i<alive.length;i++){const a=alive[i];if(!a.alive)continue;
  for(let j=i+1;j<alive.length;j++){const b=alive[j],min=a.d.radius+b.d.radius,dx=b.x-a.x,dy=b.y-a.y;if(!b.alive||Math.abs(dx)>min||Math.abs(dy)>min)continue;

  return e.t>0;
 });

function world(x,y){return {x:cam.x+(x-cam.w/2)/(cam.zoom*cam.base),y:cam.y+(y-cam.h/2)/(cam.zoom*cam.base)}}
function offsets(){
 const g=Math.max(26,defs[game.unit].radius*2.5),dir=game.team==='blue'?1:-1;
 if(game.form==='line')return [-2,-1,0,1,2].map(y=>[0,y*g]);
 if(game.form==='square')return [-1,0,1].flatMap(x=>[-1,0,1].map(y=>[x*g,y*g]));
 if(game.form==='wedge')return [[g*dir,0],[0,-g*.85],[0,g*.85],[-g*dir,-g*1.7],[-g*dir,0],[-g*dir,g*1.7]];return [[0,0]];
}
function place(w,erase){
 if(game.phase!=='setup')return;
 if(erase){const count=game.units.length;game.units=game.units.filter(u=>distance(w,u)>Math.max(36,u.d.radius+16));if(count!==game.units.length)custom()}
 else{const d=defs[game.unit];let placed=false;
 for(const [ox,oy] of offsets()){const x=w.x+ox,y=w.y+oy;
 if(x<30||x>1970||y<30||y>1170||blocked(x,y,d.radius)||game.units.some(u=>Math.hypot(x-u.x,y-u.y)<(d.radius+u.d.radius)*.72))continue;
 if(spawn(d.id,game.team,x,y))placed=true}if(placed){tone('place');custom()}}
 stats();
}
function list(){
 const display=game.cat==='all'?UNITS:UNITS.filter(d=>d.cat===game.cat);
 $('roster-count').textContent=display.length+' 种';
 $('cards').replaceChildren(...display.map(d=>{const b=document.createElement('button');b.className='card'+(d.ult?' gen':'')+(d.id===game.unit&&!game.erase?' on':'');
 b.innerHTML='<span class="card-art">'+insignia(d.id)+'</span><span class="cost"><i class="coin"></i>'+d.cost+'</span><b>'+d.name+'</b><small>'+d.role+'</small>';
 b.title=d.name+' · '+d.desc;b.onclick=()=>selectUnit(d.id);b.setAttribute('aria-pressed',String(d.id===game.unit&&!game.erase));return b}));
}
function selectUnit(id){
 game.unit=id;game.erase=false;$('erase').classList.remove('on');const d=defs[id];list();
 $('inspect').innerHTML='<div class="detail-heading">'+insignia(id)+'<b>'+d.name+'</b><span>'+d.cost+' 金</span></div><div class="statrow">'+
 [['生命',d.hp],['攻击',d.atk],['护甲',d.def],['射程',d.range]].map(([k,v])=>'<div>'+k+'<b>'+v+'</b></div>').join('')+'</div><p>'+d.desc+'</p>';
}
function timestamp(){return [Math.floor(game.time/60),Math.floor(game.time)%60].map(n=>String(n).padStart(2,'0')).join(':')}
function stats(){
 let b=0,r=0,bg=0,rg=0;for(const u of game.units){if(u.alive){if(u.team==='blue'){b++;bg+=u.d.cost}else{r++;rg+=u.d.cost}}}
 $('blueStats').textContent=b+' 人 · '+bg.toLocaleString()+' 金';$('redStats').textContent=r+' 人 · '+rg.toLocaleString()+' 金';
 $('fill').style.width=((bg+rg?bg/(bg+rg):b+r?b/(b+r):.5)*100)+'%';
 $('phase').textContent=game.phase==='battle'?(game.paused?'已暂停 ':'激战中 ')+timestamp():game.phase==='ended'?'战斗结束':'布阵阶段';
 if(game.phase==='battle'){
 const generals=game.units.filter(u=>u.team==='blue'&&u.d.ult);
 [...$('skills').children].forEach((b,i)=>{const u=generals[i];b.disabled=!u.alive||u.skill>0||game.paused;b.textContent=u.d.role+' '+(!u.alive?'阵亡':u.skill>0?Math.ceil(u.skill)+'s':'就绪');b.title=u.d.name+' · 生命 '+Math.ceil(u.hp)+'/'+u.d.hp});
 }
}
function syncUI(){
 const active=game.phase==='battle';$('fight').innerHTML=icon(active?(game.paused?'play':'pause'):'swords')+'<span>'+(active?(game.paused?'继续':'暂停'):game.phase==='ended'?'还原':'开战')+'</span>';
 const generals=game.units.filter(u=>u.team==='blue'&&u.d.ult);
 $('skills').replaceChildren(...generals.map(u=>{const b=document.createElement('button');b.onclick=()=>special(u);return b}));
 $('dock').hidden=!active||!generals.length;if(game.phase!=='ended'&&$('report').open)$('report').close();stats();
}
function reportResult(teams){
 const winner=teams.blue.length?'蓝方获胜':teams.red.length?'红方获胜':'双方战平';
 $('winner').textContent=winner;$('battleSub').textContent=game.map.name+' · 战斗耗时 '+timestamp();
 $('reportStats').innerHTML=['blue','red'].map((t,i)=>'<section><b class="'+t+'">'+(i?'红':'蓝')+'方战报</b><br>出战 '+game.stats[t]+'　存活 '+teams[t].length+'<br>总伤害 '+Math.round(game.units.filter(u=>u.team===t).reduce((n,u)=>n+u.damage,0)).toLocaleString()+'</section>').join('');
 const mvp=game.units.reduce((a,b)=>a.damage>b.damage?a:b);$('mvp').textContent='本场 MVP　'+mvp.d.name+' · '+mvp.kills+' 击杀 · '+Math.round(mvp.damage)+' 伤害';
 tone('horn');$('report').showModal();
}
function atmosphere(){
 const id=game.map.id;
 const count=({snow:70,desert:45,volcano:36,plains:20,woods:25})[id]||0;
 const t=performance.now()*.001;
 ctx.save();ctx.globalAlpha=.52;ctx.fillStyle=({snow:'#fff',desert:'#a28c65',volcano:'#ce723b'})[id]||'#71845c';
 for(let i=0;i<count;i++){
  const x=(i*533+Math.sin(t*.28+i)*9+t*(id==='desert'?90:12))%2000;
  const y=((i*397+t*(id==='volcano'?-32:23))%1200+1200)%1200;
  ctx.beginPath();ctx.ellipse(x,y,id==='desert'?5:2.4,id==='snow'?2.4:1.2,i+t*.12,0,7);ctx.fill();
 }ctx.restore();
}
function unitToken(u){
 const d=u.d,general=!!d.ult,blue=u.team==='blue',color=blue?'#365e73':'#975242',light='#f6e7c4';
 ctx.save();ctx.translate(u.x,u.y);if(!u.alive){ctx.fillStyle=blue?'#48677755':'#91574755';ctx.beginPath();ctx.ellipse(0,2,d.radius*.9,d.radius*.42,u.face,0,7);ctx.fill();ctx.restore();return}
 const r=d.radius*(general?1.15:1.13);
 ctx.fillStyle='#483c3348';ctx.beginPath();ctx.ellipse(2,r*.75,r*1.05,r*.52,0,0,7);ctx.fill();
 if(general){
  ctx.strokeStyle=blue?'#496e8480':'#9b685480';ctx.lineWidth=1.6;ctx.setLineDash([7,8]);ctx.beginPath();ctx.arc(0,0,d.reach,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle='#594e37';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-r+1,-r*1.65);ctx.lineTo(-r+1,r*.9);ctx.stroke();
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-r,-r*1.65);ctx.lineTo(r*.6,-r*1.65);ctx.lineTo(r*.27,-r*1.31);ctx.lineTo(r*.6,-r);ctx.lineTo(-r,-r);ctx.closePath();ctx.fill();
 }
 ctx.beginPath();
 if(d.cat==='cavalry'){ctx.moveTo(0,-r*1.2);ctx.lineTo(r,0);ctx.lineTo(0,r*1.2);ctx.lineTo(-r,0);ctx.closePath()}
 else if(d.cat==='siege')ctx.rect(-r*.9,-r*.8,r*1.8,r*1.6);
 else{ctx.moveTo(-r*.87,-r*.84);ctx.lineTo(r*.87,-r*.84);ctx.lineTo(r*.84,r*.3);ctx.quadraticCurveTo(r*.6,r*.85,0,r*1.1);ctx.quadraticCurveTo(-r*.7,r*.82,-r*.87,r*.26);ctx.closePath()}
 ctx.fillStyle=u.flash>0?'#edddad':color;ctx.fill();ctx.strokeStyle=general?'#b08a48':'#4d4b3b';ctx.lineWidth=general?3.5:2.1;ctx.stroke();
 ctx.save();ctx.scale(.8,.8);ctx.strokeStyle=light;ctx.lineWidth=1.8;ctx.stroke();ctx.restore();
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=light;
 if(general){ctx.font='bold '+Math.round(r*1.22)+'px serif';ctx.fillText(d.name.split('·')[1][0],0,-1)}
 else{
  ctx.lineWidth=2.2;ctx.strokeStyle=light;ctx.beginPath();
  if(d.cat==='ranged'){ctx.moveTo(-r*.5,r*.35);ctx.lineTo(r*.47,-r*.45);ctx.lineTo(r*.4,-r*.08);ctx.moveTo(r*.47,-r*.45);ctx.lineTo(r*.13,-r*.4)}
  else if(d.cat==='cavalry'){ctx.moveTo(-r*.38,r*.22);ctx.lineTo(0,-r*.27);ctx.lineTo(r*.38,r*.22)}
  else if(d.cat==='siege'){ctx.moveTo(-r*.45,0);ctx.lineTo(r*.45,0);ctx.moveTo(0,-r*.4);ctx.lineTo(0,r*.4)}
  else if(d.cat==='mythic'){ctx.arc(0,0,r*.3,0,Math.PI*2)}
  else{ctx.moveTo(-r*.26,-r*.4);ctx.lineTo(-r*.26,r*.31);ctx.moveTo(r*.26,-r*.4);ctx.lineTo(r*.26,r*.31)}ctx.stroke();
 }
 if(game.hp&&(general||u.hp<d.hp)){ctx.fillStyle='#4b4738';ctx.fillRect(-r,-r-6,2*r,3.5);ctx.fillStyle=blue?'#78a9b9':'#d39073';ctx.fillRect(-r,-r-6,2*r*u.hp/d.hp,3.5)}
 if(general){const name=d.name.split('·')[1];ctx.font='bold 18px "Noto Serif CJK SC",serif';const w=ctx.measureText(name).width+16;
 ctx.fillStyle=blue?'#293e46':'#58382e';ctx.fillRect(-w/2,r+5,w,25);ctx.strokeStyle='#b9a579';ctx.lineWidth=1;ctx.strokeRect(-w/2,r+5,w,25);ctx.fillStyle='#f4e9ca';ctx.fillText(name,0,r+17)}
 ctx.restore();
}
function fieldLabel(x,text,en,blue){
 ctx.save();ctx.translate(x,125);ctx.fillStyle=blue?'#365569':'#894937';ctx.textAlign='center';ctx.font='bold 24px "Noto Serif CJK SC",serif';ctx.fillText(text,0,0);
 ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-99,-8);ctx.lineTo(-65,-8);ctx.moveTo(65,-8);ctx.lineTo(99,-8);ctx.stroke();
 ctx.font='12px Georgia';ctx.fillText(en,0,20);ctx.restore();
}
function draw(){
 const rect=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
 if(rect.width!==cam.w||rect.height!==cam.h||dpr!==cam.dpr){cam.w=rect.width;cam.h=rect.height;cam.dpr=dpr;canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);
 cam.base=(rect.width<500?Math.min(rect.width/1850,rect.height/1150):Math.max(rect.width/WORLD_W,Math.min(rect.height/WORLD_H,rect.width/1650)))}
 const z=cam.base*cam.zoom;if(!z)return;
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#bdb496';ctx.fillRect(0,0,cam.w,cam.h);
 ctx.translate(cam.w/2,cam.h/2);ctx.scale(z,z);ctx.translate(-cam.x,-cam.y);
 ctx.drawImage(sheet,0,0);
 if(game.phase==='setup'){ctx.save();ctx.strokeStyle='#80775b99';ctx.lineWidth=2;ctx.setLineDash([9,10]);ctx.beginPath();ctx.moveTo(1000,0);ctx.lineTo(1000,1200);ctx.stroke();ctx.restore();
 fieldLabel(555,'蓝 方 部 署 区','BLUE DEPLOYMENT',true);fieldLabel(1450,'红 方 部 署 区','RED DEPLOYMENT',false)}
 for(const e of game.effects){ctx.save();ctx.globalAlpha=Math.max(0,e.t/e.life)*.82;ctx.strokeStyle=ctx.fillStyle=e.color;ctx.lineWidth=4;
 ctx.beginPath();if(e.type==='beam'){ctx.lineWidth=48;ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+Math.cos(e.a)*e.r,e.y+Math.sin(e.a)*e.r);ctx.stroke()}
 else if(e.type==='arc'){ctx.lineWidth=18;ctx.arc(e.x,e.y,e.r*(1-.5*e.t/e.life),e.a-.85,e.a+.85);ctx.stroke()}
 else if(e.type==='fire'){ctx.globalAlpha*=.48;ctx.arc(e.x,e.y,e.r,0,7);ctx.fill()}
 else{ctx.arc(e.x,e.y,e.r*(1-.8*e.t/e.life),0,7);ctx.stroke()}ctx.restore()}
 for(const u of game.units)if(!u.alive)unitToken(u);for(const u of game.units)if(u.alive)unitToken(u);
 for(const p of game.shots){if(p.t<0)continue;const arc=['arrow','firearrow','boulder','javelin'].includes(p.type)?Math.sin(Math.min(1,p.t/p.dur)*Math.PI)*Math.min(100,.2*Math.hypot(p.tx-p.sx,p.ty-p.sy)):0;
 ctx.save();ctx.translate(p.x,p.y-arc);ctx.rotate(Math.atan2(p.ty-p.sy,p.tx-p.sx));ctx.beginPath();ctx.strokeStyle=p.burn?'#b5562c':'#484638';ctx.lineWidth=3;
 if(['boulder','cannonball','fireball','frostbolt','shadowbolt'].includes(p.type)){ctx.fillStyle=({fireball:'#d26b24',frostbolt:'#5b98ad',shadowbolt:'#845887'})[p.type]||'#544c41';ctx.arc(0,0,6.5,0,7);ctx.fill()}else{ctx.moveTo(-10,0);ctx.lineTo(7,0);ctx.stroke()}ctx.restore()}
 atmosphere();
 if(game.phase==='setup'&&pointer.inside&&!pointer.space&&pointer.mode!=='pan'){
 const w=world(pointer.x,pointer.y);ctx.save();ctx.strokeStyle=game.erase?'#9a4f3f':game.team==='blue'?'#365e73':'#975242';ctx.lineWidth=2;
 for(const [x,y] of game.erase?[[0,0]]:offsets()){ctx.beginPath();ctx.arc(w.x+x,w.y+y,game.erase?36:defs[game.unit].radius,0,7);ctx.stroke()}ctx.restore()}
}
for(const m of MAPS)$('maps').add(new Option(m.name,m.id));
$('maps').onchange=e=>{if(game.phase!=='setup')restore();setMap(e.target.value);custom();toast(game.map.desc)};
for(const [i,p] of presets.entries())$('preset').add(new Option(i===0?'虎牢关之战':p[0],String(i)));
$('preset').add(new Option('自定义战役','custom'));$('preset').onchange=e=>{if(e.target.value==='custom')custom();else preset(Number(e.target.value))};
for(const [cat,name] of Object.entries(categories)){const b=document.createElement('button');b.textContent=name;b.classList.toggle('on',cat==='all');b.onclick=()=>{
 game.cat=cat;for(const el of $('categories').children)el.classList.toggle('on',el===b);list();$('cards').scrollTop=0};$('categories').append(b)}
document.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>{game.team=b.dataset.team;document.querySelectorAll('[data-team]').forEach(el=>el.classList.toggle('on',el===b))});
document.querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>{game.form=b.dataset.form;game.erase=false;$('erase').classList.remove('on');document.querySelectorAll('[data-form]').forEach(el=>el.classList.toggle('on',el===b));list()});
$('erase').onclick=()=>{game.erase=!game.erase;$('erase').classList.toggle('on',game.erase);list()};
$('toggle').onclick=()=>document.body.classList.toggle('fold');
$('fight').onclick=begin;$('reset').onclick=()=>{restore();toast('已还原至开战前阵型')};
$('sound').onclick=()=>{game.sound=!game.sound;$('sound').innerHTML=icon(game.sound?'sound':'mute');$('sound').setAttribute('aria-pressed',String(game.sound));if(game.sound)tone('place')};
const speeds=[.5,1,2,4];
$('speed').onclick=()=>{game.speed=speeds[(speeds.indexOf(game.speed)+1)%4];$('speed').textContent=game.speed.toFixed(1)+'×'};
$('plus').onclick=()=>zoom(1.2);$('minus').onclick=()=>zoom(1/1.2);$('fit').onclick=fit;
$('hp').onclick=()=>{game.hp=!game.hp;$('hp').style.opacity=game.hp?'1':'.45';$('hp').setAttribute('aria-pressed',String(game.hp))};
$('auto').onchange=e=>game.auto=e.target.checked;
$('closeReport').onclick=()=>$('report').close();$('rematch').onclick=restore;
function editField(){if(game.phase!=='setup')restore();custom();$('more').open=false}
$('clearSide').onclick=()=>{editField();game.units=game.units.filter(u=>u.team!==game.team);stats()};
$('clearAll').onclick=()=>{editField();game.units=[];stats()};
$('mirror').onclick=()=>{if(game.phase!=='setup')restore();const blue=game.units.filter(u=>u.team==='blue');if(!blue.length){toast('蓝方暂无兵力可镜像');return}
 editField();game.units=blue.slice();for(const u of blue)spawn(u.d.id,'red',2000-u.x,u.y);stats();toast('已镜像蓝方阵型')};
$('random').onclick=()=>{editField();game.units=[];const gens=UNITS.filter(d=>d.ult),units=UNITS.filter(d=>!d.ult),pick=list=>list[Math.floor(Math.random()*list.length)];
 for(const team of ['blue','red']){spawn(pick(gens).id,team,team==='blue'?560:1440,600);
  for(let i=0;i<4;i++){const d=pick(units),n=d.cost>=250?2:d.cost>=140?5:9;
   for(let j=0;j<n;j++){let x=280+Math.random()*520;if(team==='red')x=2000-x;const y=200+i*210+(Math.random()-.5)*140;if(!blocked(x,y,d.radius))spawn(d.id,team,x,y)}}
 }snapshot();stats();toast('双方军团已就位')};
canvas.oncontextmenu=e=>e.preventDefault();
function locate(e){const r=canvas.getBoundingClientRect();pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top;pointer.inside=true;return world(pointer.x,pointer.y)}
canvas.onpointerdown=e=>{if(!e.isPrimary)return;const w=locate(e);canvas.setPointerCapture(e.pointerId);
 pointer.mode=e.button===1||pointer.space||game.phase!=='setup'?'pan':e.button===2||game.erase?'erase':'place';
 if(pointer.mode==='pan')canvas.style.cursor='grabbing';else place(w,pointer.mode==='erase')};
canvas.onpointermove=e=>{if(!e.isPrimary)return;const x=pointer.x,y=pointer.y,w=locate(e);
 if(pointer.mode==='pan'){cam.x=clamp(cam.x-(pointer.x-x)/(cam.zoom*cam.base),0,2000);cam.y=clamp(cam.y-(pointer.y-y)/(cam.zoom*cam.base),0,1200)}
 else if(pointer.mode)place(w,pointer.mode==='erase')};
canvas.onpointerup=canvas.onpointercancel=()=>{pointer.mode='';canvas.style.cursor=game.phase==='setup'?'crosshair':'grab'};
canvas.onpointerleave=()=>pointer.inside=false;
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:1/1.12)},{passive:false});
window.onkeydown=e=>{if(e.target.matches('select,input')||$('report').open)return;
 if(e.code==='Space'&&e.target===document.body){e.preventDefault();pointer.space=true;canvas.style.cursor='grab'}
 if(/^Digit[1-9]$/.test(e.code)&&game.phase==='battle')special(game.units.filter(u=>u.team==='blue'&&u.d.ult)[Number(e.key)-1])};
window.onkeyup=e=>{if(e.code==='Space'){pointer.space=false;canvas.style.cursor=game.phase==='setup'?'crosshair':'grab'}};
window.addEventListener('blur',()=>{pointer.mode='';pointer.space=false});
document.addEventListener('click',e=>{if(!$('more').contains(e.target))$('more').open=false});
if(matchMedia('(max-width:760px) and (orientation:landscape)').matches)document.body.classList.add('fold');
selectUnit('gen_guanyu');preset(0);
let prev=performance.now(),lastUI=0;
function loop(now){
 const dt=Math.min(.05,(now-prev)/1000);prev=now;
 if(game.phase==='battle'&&!game.paused){const steps=Math.max(1,Math.ceil(game.speed));for(let i=0;i<steps&&game.phase==='battle';i++)simulate(dt*game.speed/steps)}
 if(game.phase==='battle'&&now-lastUI>100){stats();lastUI=now}
 draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script></body></html>
